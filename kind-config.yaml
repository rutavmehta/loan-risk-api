kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: loan-risk-cluster

# Configure networking
networking:
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

# Configure nodes
nodes:
  # Control plane node
  - role: control-plane
    image: kindest/node:v1.27.0
    extraPortMappings:
      # API server
      - containerPort: 6443
        hostPort: 6443
        protocol: TCP
      # HTTP ingress
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS ingress
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # Prometheus
      - containerPort: 9090
        hostPort: 9090
        protocol: TCP
      # Grafana
      - containerPort: 3000
        hostPort: 3000
        protocol: TCP
      # Application
      - containerPort: 8000
        hostPort: 8000
        protocol: TCP
    extraMounts:
      - hostPath: /tmp/loan-risk-data
        containerPath: /data
        readOnly: false

  # Worker nodes
  - role: worker
    image: kindest/node:v1.27.0
  - role: worker
    image: kindest/node:v1.27.0
  - role: worker
    image: kindest/node:v1.27.0

# Feature gates
featureGates:
  MixedProtocols: true
  ProcMountType: true

# Runtime config
runtimeConfig:
  api/all: "true"
  api/beta: "true"

# Patch configuration for ingress
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri"]
      server_addr = "127.0.0.1"
      server_addr_path = ""
      stream_server_addr = "127.0.0.1"
      stream_server_addr_path = ""
