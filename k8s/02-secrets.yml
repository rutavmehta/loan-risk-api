---
# Secret for API credentials
apiVersion: v1
kind: Secret
metadata:
  name: loan-risk-secrets
  namespace: loan-risk-ml
type: Opaque
data:
  # Base64 encoded values - change these in production!
  # api-key: bXlzZWNyZXRhcGlrZXkxMjM=  (mysecretapikey123)
  api-key: bXlzZWNyZXRhcGlrZXkxMjM=
  db-password: ZGJwYXNzd29yZA==  # dbpassword

---
# Secret for container registry (if using private registry)
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: loan-risk-ml
type: docker.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6eyJkb2NrZXIuaW8iOnsidXNlcm5hbWUiOiJ5b3VydXNlcm5hbWUiLCJwYXNzd29yZCI6InlvdXJwYXNzd29yZCIsImF1dGgiOiJkeUJoZW10dklkMDUifX19

---
# Secret for Grafana admin credentials
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: loan-risk-ml
type: Opaque
data:
  admin-user: YWRtaW4=  # admin
  admin-password: YWRtaW4xMjM=  # admin123

