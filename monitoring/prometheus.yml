global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'loan-risk-monitoring'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # ML API Backend
  - job_name: 'loan-risk-api'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['loan-risk-api:8000']
        labels:
          service: 'loan-risk-api'
          version: '1.0'

  # ML model metrics
  - job_name: 'ml-model-metrics'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['loan-risk-api:8000']
        labels:
          service: 'ml-models'

  # Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
